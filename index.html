<!DOCTYPE html>
<html lang="en">
<head>

<body>
    
    <p><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOVE ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, #ffd8e5 0 2px, transparent 3px),
                radial-gradient(circle at 80% 70%, #ffb6ca 0 2px, transparent 3px),
                #fff0f5;

            font-family: "Courier New", monospace;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            color: #e91e4d;
            font-size: 20px;
            animation: float 4s ease-in-out infinite;
            user-select: none;
        }

        .heart:nth-child(1) {
            left: 8%;
            top: 25%;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 20%;
            top: 70%;
            animation-delay: 1s;
        }

        .heart:nth-child(3) {
            right: 12%;
            top: 35%;
            animation-delay: 2s;
        }

        .heart:nth-child(4) {
            right: 5%;
            bottom: 15%;
            animation-delay: 1.5s;
        }

        .heart:nth-child(5) {
            left: 45%;
            top: 10%;
            animation-delay: 2.5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Main window */
        .window {
            width: min(430px, 90vw);
            background: #ffc2d4;
            border: 4px solid #b94c69;
            border-radius: 12px;
            overflow: hidden;

            box-shadow:
                8px 10px 0 rgba(185, 76, 105, 0.25),
                0 20px 40px rgba(0, 0, 0, 0.12);

            position: relative;
            z-index: 10;
        }

        /* Window header */
        .title-bar {
            height: 48px;
            padding: 0 14px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #f58cab;
            border-bottom: 3px solid #b94c69;

            font-weight: bold;
            font-size: 18px;
        }

        .window-buttons {
            display: flex;
            gap: 6px;
        }

        .window-buttons span {
            width: 20px;
            height: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ffe5ed;
            border: 2px solid #b94c69;
            border-radius: 3px;

            font-size: 12px;
            color: #7d3047;
        }

        /* Small heart bar */
        .heart-bar {
            height: 40px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;

            background: #ffd9e4;
            border-bottom: 3px solid #b94c69;

            color: #d71949;
            font-size: 18px;
        }

        /* Content */
        .content {
            padding: 25px 15px 30px;
            text-align: center;

            background-color: #ffb7cc;

            background-image:
                linear-gradient(#f28eab 1px, transparent 1px),
                linear-gradient(90deg, #f28eab 1px, transparent 1px);

            background-size: 16px 16px;
        }

        .message {
            margin: 0 0 18px;

            color: #171717;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            line-height: 1.35;

            text-shadow: 1px 1px #fff;
        }

        /* Pixel cat */
        .cat {
            width: 150px;
            height: 125px;
            margin: 10px auto 15px;

            position: relative;
        }

        .cat-head {
            width: 120px;
            height: 95px;

            position: absolute;
            left: 15px;
            top: 25px;

            background: #171717;
            border-radius: 15px 15px 35px 35px;
        }

        /* ears */
        .cat-head::before,
        .cat-head::after {
            content: "";
            position: absolute;

            width: 35px;
            height: 40px;

            top: -22px;
            background: #171717;
        }

        .cat-head::before {
            left: 8px;
            clip-path: polygon(0 100%, 0 0, 100% 100%);
        }

        .cat-head::after {
            right: 8px;
            clip-path: polygon(0 100%, 100% 0, 100% 100%);
        }

        /* eyes */
        .eye {
            width: 25px;
            height: 25px;

            position: absolute;
            top: 27px;

            background: white;
            border: 5px solid #171717;
        }

        .eye.left {
            left: 18px;
        }

        .eye.right {
            right: 18px;
        }

        /* nose */
        .nose {
            width: 20px;
            height: 12px;

            position: absolute;
            top: 55px;
            left: 50%;

            transform: translateX(-50%);

            background: #f25c83;
            border-radius: 50%;
        }

        /* Heart */
        .cat-heart {
            position: absolute;
            left: 50%;
            top: 68px;

            transform: translateX(-50%) rotate(-45deg);

            width: 42px;
            height: 42px;

            background: #f21f48;
        }

        .cat-heart::before,
        .cat-heart::after {
            content: "";

            position: absolute;

            width: 42px;
            height: 42px;

            background: #f21f48;
            border-radius: 50%;
        }

        .cat-heart::before {
            top: -21px;
            left: 0;
        }

        .cat-heart::after {
            left: 21px;
            top: 0;
        }

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;

            min-height: 70px;
            position: relative;
        }

        button {
            font-family: "Courier New", monospace;
            font-weight: bold;
            cursor: pointer;
        }

        #yesBtn {
            padding: 15px 35px;

            border: 4px solid #c7193f;
            border-radius: 10px;

            background: #ed234b;
            color: white;

            font-size: 22px;

            box-shadow: 0 5px 0 #a71332;

            transition: 0.15s;
        }

        #yesBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #a71332;
        }

        #yesBtn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a71332;
        }

        #noBtn {
            padding: 10px 20px;

            background: #fff;
            color: #8e3048;

            border: 3px solid #d48a9e;
            border-radius: 7px;

            font-size: 16px;

            position: relative;
        }

        /* Success message */
        .success {
            display: none;

            padding: 15px 10px 0;

            font-size: 20px;
            font-weight: bold;
            color: #d71949;
        }

        /* Mobile */
        @media (max-width: 500px) {
            .window {
                width: 92vw;
            }

            .cat {
                transform: scale(0.9);
                margin-top: 0;
                margin-bottom: 5px;
            }

            .content {
                padding-top: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating hearts -->
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>


    <!-- Main Window -->
    <div class="window">

        <!-- Header -->
        <div class="title-bar">
            <span>LOVE</span>

            <div class="window-buttons">
                <span>−</span>
                <span>□</span>
                <span>×</span>
            </div>
        </div>


        <!-- Heart bar -->
        <div class="heart-bar">
            <span>♥</span>
            <span>▪</span>
            <span>♥</span>
            <span>▪</span>
            <span>♥</span>
        </div>


        <!-- Main content -->
        <div class="content">

            <p class="message">
                Happy 1 year, my love ♡<br>
                Still love me?
            </p>


            <!-- Pixel Cat -->
            <div class="cat">

                <div class="cat-head">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="nose"></div>

                    <div class="cat-heart"></div>

                </div>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button id="yesBtn">
                    YES
                </button>

                <button id="noBtn">
                    NO
                </button>

            </div>


            <!-- Success -->
            <div class="success" id="success">
                I knew it! ❤️<br>
                Happy 1 Year Anniversary! 💕
            </div>

        </div>
    </div>


    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const success = document.getElementById("success");

        // YES button
        yesBtn.addEventListener("click", function () {

            success.style.display = "block";

            yesBtn.innerHTML = "❤️ YES ❤️";

            noBtn.style.display = "none";

            createHearts();
        });


        // NO button moves away
        noBtn.addEventListener("mouseover", moveNoButton);

        noBtn.addEventListener("touchstart", moveNoButton);


        function moveNoButton() {

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const x = Math.max(
                10,
                Math.random() * maxX
            );

            const y = Math.max(
                10,
                Math.random() * maxY
            );

            noBtn.style.position = "fixed";
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
            noBtn.style.zIndex = "100";
        }


        // Create falling hearts
        function createHearts() {

            for (let i = 0; i < 25; i++) {

                const heart = document.createElement("div");

                heart.innerHTML = "❤️";

                heart.style.position = "fixed";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = "-30px";
                heart.style.fontSize =
                    (15 + Math.random() * 25) + "px";

                heart.style.zIndex = "999";

                document.body.appendChild(heart);

                const duration =
                    2 + Math.random() * 3;

                heart.animate(
                    [
                        {
                            transform: "translateY(0) rotate(0deg)",
                            opacity: 1
                        },
                        {
                            transform:
                                `translateY(110vh) rotate(${Math.random() * 360}deg)`,
                            opacity: 0
                        }
                    ],
                    {
                        duration: duration * 1000,
                        easing: "linear"
                    }
                );

                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);
            }
        }
    </script>

</body>
</html></p>
</body>
</html>
